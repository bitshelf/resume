name: Build Resume PDF

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # 按需安装（与 build.sh 依赖映射一致），替代 texlive-full；
      # Fandol 中文字体随 texlive-lang-chinese 提供，无需系统字体包
      - name: Install TeX Live
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends \
            texlive-xetex \
            texlive-latex-recommended \
            texlive-latex-extra \
            texlive-pictures \
            texlive-fonts-extra \
            texlive-lang-chinese \
            poppler-utils

      - name: Compile (first pass)
        run: xelatex -interaction=nonstopmode -halt-on-error resume.tex

      - name: Compile (second pass)
        run: xelatex -interaction=nonstopmode -halt-on-error resume.tex

      - name: Render preview images
        run: pdftoppm -png -r 110 resume.pdf preview

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: resume
          path: |
            resume.pdf
            preview-*.png
          if-no-files-found: error

      # main 每次推送更新滚动 Release，提供稳定分享链接：
      # https://github.com/bitshelf/resume/releases/download/latest/resume.pdf
      - name: Rolling latest release
        if: github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: 最新简历（自动构建）
          body: |
            每次推送到 main 自动更新，无需手动维护。

            - [下载 resume.pdf](https://github.com/bitshelf/resume/releases/download/latest/resume.pdf)
          prerelease: true
          files: |
            resume.pdf
            preview-*.png
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Create Release (tag)
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            resume.pdf
            preview-*.png
          generate_release_notes: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
