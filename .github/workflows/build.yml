name: Build Resume PDF

on:
  push:
    branches: [main, codex/html-resume]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: resume-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: pnpm/action-setup@v4
      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile
      - name: Install Chromium
        run: pnpm exec playwright install --with-deps chromium
      - name: Build HTML and PDF
        run: pnpm build

      # Release assets avoid Actions artifact storage; branch preview is separate.
      - name: HTML branch preview
        if: github.ref == 'refs/heads/codex/html-resume' && github.event_name != 'pull_request'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: html-preview
          target_commitish: ${{ github.sha }}
          name: HTML 简历预览
          prerelease: true
          body: HTML 分支自动生成的单文件 HTML、A4 PDF 和预览图。
          fail_on_unmatched_files: true
          files: |
            output/html/resume.html
            output/html/resume.pdf
            output/html/preview-*.png

      - name: Rolling latest release
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          target_commitish: ${{ github.sha }}
          name: 最新简历（自动构建）
          prerelease: true
          body: 每次推送到 main 自动从 HTML 生成 PDF，附带可离线打开的 HTML。
          fail_on_unmatched_files: true
          files: |
            output/html/resume.html
            output/html/resume.pdf
            output/html/preview-*.png

      - name: Tagged release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          fail_on_unmatched_files: true
          files: |
            output/html/resume.html
            output/html/resume.pdf
            output/html/preview-*.png