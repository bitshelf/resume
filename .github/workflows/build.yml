name: Build Resume PDF

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: resume-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: pnpm/action-setup@v4
      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile
      - name: Install Chromium
        run: pnpm exec playwright install --with-deps chromium
      - name: Build HTML and PDF
        run: pnpm build
      - name: Build LaTeX PDF
        run: |
          bash build.sh
          node --input-type=module -e '
            import { readFile } from "node:fs/promises";
            import { PDFDocument } from "pdf-lib";
            const pdf = await PDFDocument.load(await readFile("output/latex/resume.pdf"));
            if (pdf.getPageCount() !== 1) throw new Error("LaTeX resume must fit on one page");
          '
          cp output/latex/resume.pdf output/latex/resume-latex.pdf

      - name: Prepare GitHub Pages files
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        run: |
          mkdir -p output/pages
          cp output/html/resume.html output/pages/index.html
          cp output/html/resume.pdf output/pages/resume.pdf
          cp output/latex/resume-latex.pdf output/pages/resume-latex.pdf
      - name: Upload GitHub Pages artifact
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v4
        with:
          path: output/pages

      - name: Rolling latest release
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          target_commitish: ${{ github.sha }}
          name: 最新简历（自动构建）
          prerelease: true
          fail_on_unmatched_files: true
          files: |
            output/html/resume.html
            output/html/resume.pdf
            output/latex/resume-latex.pdf
            output/html/preview-*.png

      - name: Tagged release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          fail_on_unmatched_files: true
          files: |
            output/html/resume.html
            output/html/resume.pdf
            output/latex/resume-latex.pdf
            output/html/preview-*.png

  deploy:
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
