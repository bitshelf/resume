name: Build Resume PDF

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  build:
    # 只用 checkout/docker/release，不再依赖 runner 的 apt（Ubuntu 源在部分 runner 上
    # 反复挂死/超慢，2026-10 连续多晚观察到）；TeX Live 由预装镜像提供
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Build PDF
        uses: xu-cheng/latex-action@v3
        with:
          root_file: resume.tex
          latexmk_use_xelatex: true
          args: "-interaction=nonstopmode -halt-on-error"

      # 预览图：alpine 容器装 poppler（apk 走 Alpine CDN，绕开 Ubuntu 源）
      - name: Render preview images
        run: |
          docker run --rm -v "$PWD:/work" -w /work alpine:3.20 \
            sh -c "apk add -q poppler-utils && pdftoppm -png -r 110 resume.pdf preview"
          ls preview-*.png

      # 制品不上传（私有库存储配额有限），PDF/预览图一律走 Release 资产分发
      # main 每次推送更新滚动 Release，提供稳定分享链接：
      # https://github.com/bitshelf/resume/releases/download/latest/resume.pdf
      - name: Rolling latest release
        if: github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: 最新简历（自动构建）
          body: |
            每次推送到 main 自动更新，无需手动维护。

            - [下载 resume.pdf](https://github.com/bitshelf/resume/releases/download/latest/resume.pdf)
          prerelease: true
          files: |
            resume.pdf
            preview-*.png
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Create Release (tag)
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            resume.pdf
            preview-*.png
          generate_release_notes: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
